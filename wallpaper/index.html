<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dijital Gösterge Paneli</title>
<style>
:root{ --acc:#ff2e3e; --ice:#7fd4ff; --amber:#ffae00; --red:#ff2d3f; --green:#22e07a; --blue:#2f8bff; --dim:rgba(255,255,255,.07); --muted:#8a93a3; --u:10px; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%}

/* uyarı ışıkları */
.lights{position:absolute;left:50%;top:9%;transform:translate(calc(-50% + var(--px,0px)),var(--py,0px));display:flex;gap:calc(var(--u)*1.1)}
.lt{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2)}
.lt svg{width:100%;height:100%;fill:none;stroke:var(--dim);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s,filter .25s}
.lt svg .f{fill:var(--dim);stroke:none;transition:fill .25s}
.lt.on svg{stroke:var(--c);filter:drop-shadow(0 0 6px var(--c))}
.lt.on svg .f{fill:var(--c)}
.lt.blink.on svg{animation:blink .7s steps(1) infinite}
.lt.blink.on svg .f{animation:blinkf .7s steps(1) infinite}
@keyframes blink{50%{stroke:var(--dim);filter:none}} @keyframes blinkf{50%{fill:var(--dim)}}

/* orta bilgi ekranı (klasik mod) */
.mfd{position:absolute;left:50%;top:47%;transform:translate(calc(-50% + var(--px,0px)),calc(-50% + var(--py,0px)));width:var(--mw);height:calc(var(--mw)*.95);padding:calc(var(--u)*1.6) calc(var(--u)*1.8);transition:opacity .6s;
  border-radius:calc(var(--u)*2.2);overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#15181e 0%,#0a0b0e 60%,#060708 100%);
  box-shadow:
    inset 0 calc(var(--u)*1.2) calc(var(--u)*2) rgba(0,0,0,.85),          /* üstten iç gölge: gömük */
    inset 0 -1px 0 rgba(255,255,255,.10),                                  /* alt kenar ışığı */
    0 0 0 calc(var(--u)*.45) #101216,                                      /* çerçeve gövdesi */
    0 0 0 calc(var(--u)*.55) rgba(255,255,255,.14),                        /* çerçeve dış pahı */
    0 calc(var(--u)*-.2) 0 calc(var(--u)*.55) rgba(255,255,255,.06),       /* üst pah ışığı */
    0 calc(var(--u)*2.4) calc(var(--u)*4) rgba(0,0,0,.75),                 /* zemine gölge */
    0 0 calc(var(--u)*4) rgba(255,46,62,.08)}                              /* kırmızı ortam ışığı */
.mfd::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit;
  background:linear-gradient(125deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.02) 28%,rgba(255,255,255,0) 42%),
             linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%);}
.mfd::after{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;z-index:3;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.mfd .hdr{position:relative;z-index:2;padding-bottom:calc(var(--u)*.8);border-bottom:1px solid rgba(255,255,255,.06)}
.mfd .hdr::after{content:"";position:absolute;left:0;bottom:-1px;width:calc(var(--u)*4);height:2px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.hint{font-size:calc(var(--u)*1.15);color:var(--amber);margin-top:calc(var(--u)*1);line-height:1.4;display:none}
.notele .hint{display:block}
.sport .mfd{opacity:0;pointer-events:none}
.mfd .hdr{display:flex;justify-content:space-between;font-size:calc(var(--u)*1.3);color:var(--muted);letter-spacing:.1em}
.page{position:absolute;inset:calc(var(--u)*4.4) calc(var(--u)*1.8) calc(var(--u)*3);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;display:flex;flex-direction:column;justify-content:center}
.page.on{opacity:1;transform:none}
.ptitle{font-size:calc(var(--u)*1.25);color:var(--acc);letter-spacing:.18em;margin-bottom:calc(var(--u)*1)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:calc(var(--u)*.55) 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:calc(var(--u)*1.6)}
.kv span{color:var(--muted);font-size:calc(var(--u)*1.25)}
.kv b{font-weight:400}
.bar{height:calc(var(--u)*.4);background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ice);transition:width .6s,background .6s}
.big{font-size:calc(var(--u)*5.5);font-weight:300;line-height:1}
.wxrow{display:flex;align-items:center;gap:calc(var(--u)*1.6)}
.wxic{font-size:calc(var(--u)*5)}
.media{display:flex;gap:calc(var(--u)*1.6);align-items:center}
.cover{width:calc(var(--u)*10);height:calc(var(--u)*10);border-radius:calc(var(--u)*1);background:#111 center/cover;flex-shrink:0;display:grid;place-items:center;font-size:calc(var(--u)*3.4);color:var(--muted)}
.mt{font-size:calc(var(--u)*1.9);line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ma{font-size:calc(var(--u)*1.35);color:var(--muted);margin-top:6px}
.prog{margin-top:calc(var(--u)*1.6)}
.pbar{height:calc(var(--u)*.45);background:rgba(255,255,255,.12);border-radius:9px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:9px;box-shadow:0 0 10px var(--acc)}
.pbar i::after{content:"";position:absolute;right:calc(var(--u)*-.6);top:50%;width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);border-radius:50%;background:#fff;transform:translateY(-50%)}
.ptime{display:flex;justify-content:space-between;font-size:calc(var(--u)*1.25);color:var(--muted);margin-top:calc(var(--u)*.7)}
.dots{position:absolute;bottom:calc(var(--u)*1);left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);transition:.3s}
.dots i.on{background:var(--acc);width:16px;border-radius:3px}

/* uyarı kutusu */
.alert{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.96);width:var(--mw);padding:calc(var(--u)*2.4);border-radius:calc(var(--u)*1.6);background:rgba(14,3,5,.96);border:1px solid rgba(255,45,63,.35);display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--u)*.8);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.sport .alert{top:62%}
.alert.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.alert .ai{width:calc(var(--u)*6);height:calc(var(--u)*6)}
.alert .ai svg{width:100%;height:100%;fill:none;stroke:var(--ac,var(--amber));stroke-width:1.8;filter:drop-shadow(0 0 8px var(--ac,var(--amber)))}
.alert .ai svg .f{fill:var(--ac,var(--amber));stroke:none}
.alert b{font-size:calc(var(--u)*2);font-weight:500}
.alert span{font-size:calc(var(--u)*1.4);color:#ccc}

/* mod düğmesi */
.modebtn{position:absolute;left:calc(var(--u)*2.5);bottom:calc(var(--u)*2.5);z-index:5;font:inherit;font-size:calc(var(--u)*1.2);letter-spacing:.15em;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:calc(var(--u)*.6) calc(var(--u)*1.4);cursor:pointer}
.modebtn:hover{color:#fff;border-color:var(--acc)}
.switching .mfd,.switching .lights{opacity:0;filter:blur(6px);transition:opacity .35s,filter .35s}
.lights{transition:opacity .5s .2s,filter .5s .2s}
.page{transition:opacity .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1),filter .55s!important}
.page{transform:translateX(18%)!important;filter:blur(4px)}
.page.on{transform:none!important;filter:none}
.page.out{transform:translateX(-18%)!important;opacity:0}
.ptitle{transition:letter-spacing .6s}
.page:not(.on) .ptitle{letter-spacing:.4em}
.alert.on{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.7);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.fade{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,60,80,.35),#000 70%);opacity:0;pointer-events:none;transition:opacity .35s}
.fade.on{opacity:1}
canvas{transition:transform .35s ease,filter .35s ease}
.warp canvas{transform:scale(1.08);filter:blur(10px) brightness(1.8)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="fx" style="pointer-events:none;z-index:4"></canvas>

<div class="lights" id="lights"></div>

<div class="mfd" id="mfd">
  <div class="hdr"><span id="hdrL">--°C</span><span id="hdrR">--</span></div>
  <div class="page" data-p="0">
    <div class="ptitle">SÜRÜŞ BİLGİSAYARI</div>
    <div class="kv"><span>İşlemci yükü</span><b id="pCpu">--</b></div><div class="bar"><i id="bCpu"></i></div>
    <div class="kv"><span>Bellek</span><b id="pRam">--</b></div><div class="bar"><i id="bRam"></i></div>
    <div class="kv"><span>Disk C: dolu</span><b id="pDisk">--</b></div><div class="bar"><i id="bDisk"></i></div>
    <div class="kv"><span>CPU sıcaklığı</span><b id="pTemp">--</b></div>
    <div class="hint">Sistem verisi gelmiyor. Klasördeki <b>telemetri\Baslangica-Ekle.bat</b> dosyasını çalıştır.</div>
  </div>
  <div class="page" data-p="1">
    <div class="ptitle">BAĞLANTI</div>
    <div class="kv"><span>Ağ</span><b id="pSsid">--</b></div>
    <div class="kv"><span>Sinyal (yakıt)</span><b id="pSig">--</b></div>
    <div class="kv"><span>Gecikme</span><b id="pPing">--</b></div>
    <div class="kv"><span>↓ İndirme</span><b id="pDown">--</b></div>
    <div class="kv"><span>↑ Yükleme</span><b id="pUp">--</b></div>
  </div>
  <div class="page" data-p="2">
    <div class="ptitle">MEDYA</div>
    <div class="media"><div class="cover" id="mCover">♪</div><div style="min-width:0"><div class="mt" id="mTitle">Medya yok</div><div class="ma" id="mArtist"></div></div></div>
    <div class="prog" id="mProg"><div class="pbar"><i id="mFill"></i></div><div class="ptime"><span id="mPos">--:--</span><span id="mState"></span><span id="mRem">--:--</span></div></div>
  </div>
  <div class="page" data-p="3">
    <div class="ptitle" id="wCity">DIŞ HAVA</div>
    <div class="wxrow"><div class="wxic" id="wIc">—</div><div><div class="big" id="wT">--°</div><div class="ma" id="wD">Yükleniyor</div></div></div>
    <div class="kv" style="margin-top:12px"><span>Bugün</span><b id="wMm">-- / --</b></div>
  </div>
  <div class="dots"><i></i><i></i><i></i><i></i></div>
</div>

<div class="alert" id="alert"><div class="ai" id="aIc"></div><b id="aT"></b><span id="aD"></span></div>
<button class="modebtn" id="modebtn">KLASİK KADRAN</button>
<div class="fade" id="fade"></div>

<script>
/* =========================================================
   AYARLAR
   ========================================================= */
const CFG = {
  telemetryUrl: "http://localhost:8765/",
  city: "İstanbul", lat: 41.11, lon: 29.02,
  pageSeconds: 7,
  mode: "classic",          // classic | sport (yalnızca elle değişir)
  demo: /demo/.test(location.search)
};
if(/sport/.test(location.search)) CFG.mode="sport";

/* =========================================================
   İKONLAR (24x24)
   ========================================================= */
const IC = {
  sigL:  '<path class="f" d="M10 5L3 12l7 7v-4h11V9H10z"/>',
  sigR:  '<path class="f" d="M14 5l7 7-7 7v-4H3V9h11z"/>',
  low:   '<path d="M11 6c-4.5 0-7 2.7-7 6s2.5 6 7 6V6z"/><path d="M14.5 8.5l6-1.5M14.5 11.5l6-1.5M14.5 14.5l6-1.5M14.5 17.5l6-1.5"/>',
  high:  '<path class="f" d="M11 6c-4.5 0-7 2.7-7 6s2.5 6 7 6V6z"/><path d="M14.5 8h6M14.5 11h6M14.5 14h6M14.5 17h6"/>',
  engine:'<path d="M2.5 10v6M2.5 13h2.5M5 9.5h3V7.5h6v2h2l2 2h1.5V9.5h2v8h-2v-2.3H18l-2.5 3.3H8.5L5 15.5z"/>',
  temp:  '<path d="M10 4.5a2 2 0 0 1 4 0V14a4 4 0 1 1-4 0z"/><path d="M12 8v7"/><path d="M3 20c1.5-1 3-1 4.5 0s3 1 4.5 0 3-1 4.5 0 3 1 4.5 0"/>',
  oil:   '<path d="M2.5 9h3.5l2-1.5h6.5L21 10.5l1.5-1.5"/><path d="M6 9v6h10.5L21 10.5"/><path d="M9.5 7.5V5.5h3v2"/><path class="f" d="M21.5 14c0 1-1 1.8-1 1.8s-1-.8-1-1.8.5-1.6 1-2.3c.5.7 1 1.3 1 2.3z"/>',
  batt:  '<rect x="3" y="7" width="18" height="12" rx="1.5"/><path d="M6.5 7V4.5h3V7M14.5 7V4.5h3V7M6.5 13h4M13.5 13h4M15.5 11v4"/>',
  fuel:  '<path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3.5 21h13"/><rect x="7" y="6" width="6" height="4"/><path d="M15 10h2a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
  warn:  '<path d="M12 3.5L2.5 20h19z"/><path d="M12 9.5v5M12 17.2v.3"/>',
  svc:   '<path d="M14.7 6.3a4 4 0 0 0-5.3 5.3L3.5 17.5l3 3 5.9-5.9a4 4 0 0 0 5.3-5.3l-2.5 2.5-2.3-.7-.7-2.3z"/>',
};
const LIGHTS = [
  {k:"sigL",c:"var(--green)",blink:true},{k:"low",c:"var(--green)"},{k:"high",c:"var(--blue)"},
  {k:"engine",c:"var(--amber)"},{k:"temp",c:"var(--red)"},{k:"oil",c:"var(--red)"},{k:"batt",c:"var(--red)"},
  {k:"fuel",c:"var(--amber)"},{k:"warn",c:"var(--amber)"},{k:"svc",c:"var(--amber)"},{k:"sigR",c:"var(--green)",blink:true},
];
const $ = id=>document.getElementById(id);
$("lights").innerHTML = LIGHTS.map(l=>`<div class="lt${l.blink?" blink":""}" id="L_${l.k}" style="--c:${l.c}"><svg viewBox="0 0 24 24">${IC[l.k]}</svg></div>`).join("");
function light(k,on,color){ const e=$("L_"+k); e.classList.toggle("on",!!on); if(color) e.style.setProperty("--c",color); }

/* =========================================================
   DURUM + VERİ
   ========================================================= */
const S = { tele:false, pingSrc:null, cpu:0, ram:0, disk:0, temp:null, netType:"none", signal:0, ssid:null, online:navigator.onLine, ping:null, down:0, up:0, uptimeMin:0,
  media:{title:null,artist:null,thumb:null,img:null,color:null,playing:false,pos:0,dur:0,at:0}, wx:null };
const start=Date.now();
const TV=(v,f)=> S.tele && v!=null ? f(v) : "--";

const TELE_URLS=["http://localhost:8765/","http://127.0.0.1:8765/"]; let teleIdx=0, teleFails=0;
async function pollTele(){
  if(CFG.demo){ demoTick(); return; }
  for(let k=0;k<TELE_URLS.length;k++){
    const url=TELE_URLS[(teleIdx+k)%TELE_URLS.length];
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),1500);
      const d=await (await fetch(url+"?t="+Date.now(),{signal:ctl.signal,cache:"no-store"})).json(); clearTimeout(to);
      teleIdx=(teleIdx+k)%TELE_URLS.length; teleFails=0;
      Object.assign(S,{tele:true,cpu:+d.cpu||0,ram:+d.ram||0,disk:+d.disk||0,temp:(d.temp==null?null:+d.temp),netType:d.netType||"none",signal:+d.signal||0,ssid:d.ssid||null,
        online:!!d.online,ping:(d.ping==null?null:+d.ping),down:+d.down||0,up:+d.up||0,uptimeMin:+d.uptimeMin||0,pingSrc:"tele"});
      return;
    }catch(e){}
  }
  // 3 deneme üst üste başarısızsa "veri yok" moduna geç (anlık kopmalarda ekran titremesin)
  if(++teleFails<3 && S.tele) return;
  S.tele=false;
  // tarayıcının kendi verebildikleri
  const nc=navigator.connection||{};
  S.online=navigator.onLine;
  S.ping= nc.rtt? nc.rtt : null; S.pingSrc="tahmini";
  S.netType= S.online? (nc.type==="wifi"||nc.type==="ethernet"? nc.type : "unknown") : "none";
  S.signal = !S.online? 0 : nc.downlink? Math.min(100, Math.round(nc.downlink/10*100)) : 100;
  S.uptimeMin=(Date.now()-start)/60000;
}
let dm={cpu:25,temp:52,sig:78,t:0};
function demoTick(){
  dm.t++; dm.cpu=Math.max(2,Math.min(99,dm.cpu+(Math.random()-.47)*16)); dm.temp=Math.max(38,Math.min(96,dm.temp+(dm.cpu-45)*.05+(Math.random()-.5)*2)); dm.sig=Math.max(5,Math.min(100,dm.sig+(Math.random()-.5)*8));
  Object.assign(S,{tele:true,cpu:dm.cpu,ram:58,disk:71,temp:dm.temp,netType:"wifi",signal:dm.sig,ssid:"EvAgi_5G",online:true,ping:18+Math.random()*20,down:Math.random()<.5?Math.random()*4:0,up:Math.random()<.3?Math.random():0,uptimeMin:754+dm.t/30});
}
setInterval(pollTele,2000); pollTele();
addEventListener("online",pollTele); addEventListener("offline",pollTele);

function wInfo(c){ if(c===0)return["☀️","Açık"]; if(c<=2)return["🌤️","Az bulutlu"]; if(c===3)return["☁️","Bulutlu"]; if(c<=48)return["🌫️","Sisli"]; if(c<=67)return["🌧️","Yağmurlu"]; if(c<=77)return["❄️","Karlı"]; if(c<=82)return["🌦️","Sağanak"]; if(c<=86)return["🌨️","Kar"]; return["⛈️","Fırtına"]; }
async function loadWx(){
  try{ const d=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}&current=temperature_2m,weather_code,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`)).json();
       S.wx={t:d.current.temperature_2m,c:d.current.weather_code,h:d.current.relative_humidity_2m,max:d.daily.temperature_2m_max[0],min:d.daily.temperature_2m_min[0]};
  }catch(e){ if(CFG.demo) S.wx={t:14.5,c:2,h:71,max:17,min:10}; }
}
async function setCity(name){
  if(!name) return; CFG.city=name;
  try{ const g=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=tr`)).json();
       if(g.results&&g.results[0]){ CFG.lat=g.results[0].latitude; CFG.lon=g.results[0].longitude; } }catch(e){}
  loadWx();
}
loadWx(); setInterval(loadWx,20*60*1000);

/* ---- Medya yardımcıları ---- */
function mediaPos(){ const m=S.media; let p=m.pos+(m.playing?(performance.now()-m.at)/1000:0); return m.dur? Math.min(p,m.dur):p; }
const fmtT=t=>{ t=Math.max(0,Math.floor(t)); return Math.floor(t/60)+":"+p2(t%60); };
function setCover(src,color){
  S.media.thumb=src; S.media.color=color;
  if(!src){ S.media.img=null; return; }
  const im=new Image(); im.onload=()=>{ S.media.img=im; }; im.src=src;
}
function onTrackChange(){ if(typeof showPage==="function" && S.media.title) showPage(2); }
/* demo: örnek şarkı */
if(CFG.demo){
  const c=document.createElement("canvas"); c.width=c.height=300; const x=c.getContext("2d");
  let g=x.createLinearGradient(0,0,300,300); g.addColorStop(0,"#ff5e62"); g.addColorStop(.5,"#7b2ff7"); g.addColorStop(1,"#1fa2ff"); x.fillStyle=g; x.fillRect(0,0,300,300);
  x.fillStyle="rgba(255,255,255,.85)"; x.beginPath(); x.arc(150,150,70,0,7); x.fill(); x.fillStyle="#111"; x.beginPath(); x.arc(150,150,14,0,7); x.fill();
  Object.assign(S.media,{title:"Gece Yolculuğu",artist:"Demo Sanatçı",playing:true,pos:78,dur:214,at:performance.now()});
  setCover(c.toDataURL(),"#7b2ff7");
}

/* ---- Wallpaper Engine ---- */
window.wallpaperPropertyListener = {
  applyUserProperties(p){
    if(p.accent){ const c=p.accent.value.split(" ").map(x=>Math.round(parseFloat(x)*255)).join(","); document.documentElement.style.setProperty("--acc",`rgb(${c})`); ACC=`rgb(${c})`; }
    if(p.city) setCity(p.city.value);
    if(p.pageseconds) CFG.pageSeconds=p.pageseconds.value;
    if(p.mode){ CFG.mode=["classic","sport"][p.mode.value]||"classic"; updateModeBtn(); }
  }
};
if(window.wallpaperRegisterMediaPropertiesListener){

function polyPts(){ return [[W*.17,H*.40],[W*.25,H*.25],[W*.75,H*.25],[W*.83,H*.40]]; }

    ctx.fillStyle=ACC; ctx.fillRect(tx+i*U*.75, y0+cs-h, U*.45, h); }
  // ilerleme çubuğu
  const by=y0+cs+U*2.4, pos=mediaPos(), f=m.dur? clamp(pos/m.dur):0;

  if(m.dur){ ctx.fillStyle="#fff"; ctx.shadowColor=ACC; ctx.shadowBlur=U*1.2; rr(x0,by,pw*f,U*.5,U*.25); ctx.fill(); ctx.shadowBlur=0;

  ctx.textAlign="center"; ctx.fillText(m.playing?"▶":"❚❚", W/2, by+U*2.6);
  ctx.restore();
}
function fit(t,w){ if(ctx.measureText(t).width<=w) return t; while(t.length>1&&ctx.measureText(t+"…").width>w) t=t.slice(0,-1); return t+"…"; }

function bgClassic(now){
  let g=ctx.createRadialGradient(W/2,H*.5,0,W/2,H*.5,W*.7); g.addColorStop(0,"#0d1015"); g.addColorStop(1,"#000"); ctx.fillStyle=g; ctx.fillRect(-W*.05,-H*.05,W*1.1,H*1.1);

const fx=document.getElementById("fx"), fctx=fx.getContext("2d");
function resizeFx(){ fx.width=W*DPR; fx.height=H*DPR; fctx.setTransform(DPR,0,0,DPR,0,0); }
function screenRect(){ return {x:0,y:0,w:W,h:H,r:0}; }
function rrP(c,x,y,w,h,r,keep){ if(!keep) c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function glass(now){
  const c=fctx, S_=screenRect(); c.clearRect(0,0,W,H);
  const gx=-PX.x*U*5, gy=-PX.y*U*3;          // yansımalar ters yönde kayar
  c.save(); rrP(c,S_.x,S_.y,S_.w,S_.h,S_.r); c.clip();

  // 1) güneşlik gölgesi (üstten)
  let g=c.createLinearGradient(0,S_.y,0,S_.y+H*.2); g.addColorStop(0,"rgba(0,0,0,.75)"); g.addColorStop(.35,"rgba(0,0,0,.25)"); g.addColorStop(1,"rgba(0,0,0,0)");
  c.fillStyle=g; c.fillRect(0,0,W,H*.3);

  c.globalCompositeOperation="lighter";
  // 3) kadranların camda yansıması (kırmızı halkalar, kayık ve bulanık)
  if(!viewSport){ const R=dialR();
    c.save(); c.shadowColor=ACC; c.shadowBlur=U*7; c.strokeStyle=ACC; c.globalAlpha=.03; c.lineWidth=R*.06;
    [W*.25,W*.75].forEach(x=>{ c.beginPath(); c.ellipse(x+gx*1.6,H*.47+gy*1.6-U*2,R*1.02,R*.98,0,0,7); c.stroke(); }); c.restore();
  } else {
    c.save(); c.globalAlpha=.05; c.fillStyle=ACC; c.shadowColor=ACC; c.shadowBlur=U*8; c.fillRect(W*.25+gx*1.6,H*.25+gy*1.6-U*2,W*.5,U*1.2); c.restore();
  }

  // 4) ön cam yansıması: yumuşak, uzun eğik ışık lekeleri (köşesiz)
  c.save(); c.translate(gx,gy);
  const streak=(x,y,rot,sx,sy,al)=>{ c.save(); c.translate(x,y); c.rotate(rot); c.scale(sx,sy);
    const rg=c.createRadialGradient(0,0,0,0,0,1); rg.addColorStop(0,`rgba(205,222,255,${al})`); rg.addColorStop(.6,`rgba(205,222,255,${al*.35})`); rg.addColorStop(1,"rgba(205,222,255,0)");
    c.fillStyle=rg; c.beginPath(); c.arc(0,0,1,0,7); c.fill(); c.restore(); };
  streak(W*.3,H*.24,-.55,W*.42,H*.05,.06);
  streak(W*.36,H*.33,-.55,W*.3,H*.018,.05);
  streak(W*.74,H*.18,-.5,W*.18,H*.03,.035);
  // camın bombesi: üst-orta yumuşak parlama
  let gb=c.createRadialGradient(W*.5,-H*.6,H*.6,W*.5,-H*.6,H*1.15); gb.addColorStop(0,"rgba(255,255,255,0)"); gb.addColorStop(.9,"rgba(255,255,255,.03)"); gb.addColorStop(1,"rgba(255,255,255,0)");
  c.fillStyle=gb; c.fillRect(0,0,W,H*.6);
  // 5) lekeler: yalnızca yansıma bölgesinde görünür
  smudges.forEach(m=>{ const x=m.x*W, y=m.y*H, rr=m.r*W, vis=clamp(1-Math.abs((x/W*.6+y/H)-.55)*2.2)*m.a;
    if(vis<=0) return; const sg=c.createRadialGradient(x,y,0,x,y,rr); sg.addColorStop(0,`rgba(220,230,255,${.02*vis})`); sg.addColorStop(1,"rgba(220,230,255,0)");
    c.fillStyle=sg; c.beginPath(); c.arc(x,y,rr,0,7); c.fill(); });
  c.restore();

  // 6) ara sıra geçen ışık süpürmesi
  const per=16000, t=(now%per)/per; if(t<.2){ const x=-W*.3+t/.2*W*1.6;
    g=c.createLinearGradient(x-W*.06,0,x+W*.06,0); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(.5,"rgba(255,255,255,.04)"); g.addColorStop(1,"rgba(255,255,255,0)");
    c.save(); c.transform(1,0,-.45,1,H*.25,0); c.fillStyle=g; c.fillRect(x-W*.08,0,W*.16,H); c.restore(); }
  c.globalCompositeOperation="source-over";

  // 7) cam dokusu
  c.globalAlpha=.55; c.fillStyle=c.createPattern(grain,"repeat"); c.fillRect(0,0,W,H); c.globalAlpha=1;
  // 8) kenar karartması
  g=c.createRadialGradient(W/2,H/2,H*.5,W/2,H/2,W*.62); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(0,0,0,.5)"); c.fillStyle=g; c.fillRect(0,0,W,H);
  c.restore();

}
function bgSport(now){

/* ---------- Ana döngü ---------- */
function frame(now){
  const d=new Date(), hr=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600, sec=d.getSeconds()+d.getMilliseconds()/1000;
  const st=(now-sweepStart)/1000; let sweep=null; if(st<2.2) sweep= st<1.1? Math.sin(st/1.1*Math.PI/2) : Math.cos((st-1.1)/1.1*Math.PI/2);
  const dt=Math.min(.05,(now-lastNow)/1000); lastNow=now;
  sm.temp=SP.temp.step(S.temp??30,dt); sm.sig=SP.fuel.step(S.online?S.signal:0,dt); sm.cpu=SP.cpu.step(S.cpu,dt); sm.ram=SP.ram.step(S.ram,dt);
  const secS = SP.sec.step(sweep!=null? sweep*60 : sec, dt), hrS = SP.hr.step(sweep!=null? sweep*24 : hr, dt);
  const hot=S.temp!=null&&S.temp>=90, noNet=!S.online, blinkOn=Math.floor(now/500)%2;
  const tFrac=clamp((sm.temp-30)/(110-30)), fFrac=clamp(sm.sig/100);
  const shift = sweep==null && d.getSeconds()>=55;

  updParallax(now);
  mctx.fillStyle="#000"; mctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(PX.x*U*.3,PX.y*U*.2);           // arka plan az kayar
  if(viewSport) bgSport(now); else bgClassic(now);
  ctx.restore();
  // mod geçişi zamanlaması
  let mk=null, mPhase=0;
  if(MA.on){ const e=(now-MA.start)/1000;
    if(e<.42){ mPhase=-1; mk=e/.42; }
    else { if(!MA.swapped){ MA.swapped=true; viewSport=MA.target; document.body.classList.toggle("sport",viewSport); sweepStart=now; SP.sec.x=0; SP.hr.x=0; }
           mPhase=1; mk=Math.min(1,(e-.42)/.55); if(e>1.0){ MA.on=false; document.body.classList.remove("switching"); } } }
  ctx=lctx; ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(PX.x*U*.9,PX.y*U*.6);           // göstergeler daha çok kayar

  // yan merdivenler
  ladder(-1, sweep!=null?sweep:tFrac, { labels:[[0,"30"],[.5,"70"],[1,"110"]], icon:"temp",
    col:t=> t>=.75?"#ff2d3f": t>=.6?"#ffae00":"#ffffff", iconCol: hot?"#ff2d3f":null, text: !S.tele? "VERİ YOK" : S.temp==null?"-- °C":Math.round(S.temp)+" °C" });
  ladder( 1, sweep!=null?sweep:fFrac, { labels:[[0,"E"],[.5,"½"],[1,"F"]], icon:"fuel",
    col:()=> fFrac<.25?"#ffae00":"#fff", iconCol: noNet?(blinkOn?"#ff2d3f":"rgba(255,45,63,.25)"): S.signal<25?"#ffae00":null,
    text: noNet?"YOK": !S.tele? "BAĞLI" : S.netType==="ethernet"?"KABLO":"%"+Math.round(S.signal) });

  if(!viewSport){
    const R=dialR();
    dial({cx:W*.25,cy:H*.47,R,max:24,major:2,minor:.5,label:v=>v, val:hrS,
      inner:{frac:(d.getMinutes()*60+d.getSeconds())/3600, col:"rgba(127,212,255,.85)", label:"DAKİKA"},
      big:p2(d.getHours())+":"+p2(d.getMinutes()), unit:"SAAT", top:`${DAYS[d.getDay()]} · ${d.getDate()} ${MONTHS[d.getMonth()]}`,
      bottom: S.media.title? "♪ "+S.media.title.slice(0,22) : null });
    dial({cx:W*.75,cy:H*.47,R,max:60,major:10,minor:2,label:v=>v,red:[50,60], val:secS, shift,
      inner:{frac:sm.cpu/100, col: S.cpu>90?"#ff2d3f":"rgba(127,212,255,.85)", label:"CPU YÜKÜ"},
      big:p2(d.getSeconds()), unit:"SANİYE", top:"CPU "+TV(S.cpu,v=>"%"+Math.round(v)), topCol:S.tele&&S.cpu>90?"#ff5a66":null,
      bottom: S.ping!=null? Math.round(S.ping)+" ms" : null });
    // üst orta tarih
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="rgba(255,255,255,.85)"; ctx.font=FONT(U*2.2);
    ctx.fillText(p2(d.getHours())+":"+p2(d.getMinutes()), W/2, H*.045);
  } else {
    sportBar(secS, 60, 50);
    if(shift){ ctx.fillStyle=`rgba(255,40,60,${.05+.05*Math.sin(now/60)})`; ctx.fillRect(0,0,W,H); }
    // orta büyük saat
    const mt=clamp(SP.media.step(S.media.title&&S.media.playing?1:0,dt));
    const clockY=lerp(H*.6,H*.425,mt), clockSz=lerp(U*15,U*6.5,mt);
    ctx.save(); ctx.translate(W/2,clockY); ctx.transform(1,0,-.12,1,0,0);
    let tg=ctx.createLinearGradient(0,-U*11,0,0); tg.addColorStop(0,"#ffffff"); tg.addColorStop(1,"#c9ced6");
    ctx.textAlign="center"; ctx.textBaseline="alphabetic"; ctx.fillStyle=tg; ctx.font=FONT(clockSz,700);
    ctx.shadowColor="rgba(255,60,80,.45)"; ctx.shadowBlur=U*4; ctx.fillText(p2(d.getHours())+":"+p2(d.getMinutes()), 0, 0); ctx.shadowBlur=0; ctx.restore();
    ctx.globalAlpha=1-mt; ctx.font=FONT(U*2.2); ctx.fillStyle="rgba(255,255,255,.75)"; ctx.fillText(`${DAYS[d.getDay()]} · ${d.getDate()} ${MONTHS[d.getMonth()]} · SAAT`, W/2, H*.6+U*3.6); ctx.globalAlpha=1;
    if(mt>.01) mediaPanel(mt);

    icon("gauge", W*.27, H*.5, U*4.2, "#fff");
    ctx.textAlign="left"; ctx.font=FONT(U*3.2,600); ctx.fillStyle= S.cpu>90?"#ff5a66":"#fff"; ctx.fillText(TV(sm.cpu,v=>"%"+Math.round(v)), W*.27+U*3.4, H*.5+U*.6);
    ctx.font=FONT(U*1.7); ctx.fillStyle="rgba(255,255,255,.75)"; ctx.fillText("İşlemci yükü", W*.27+U*3.4, H*.5+U*3.4);

    ctx.font=FONT(U*3.2,600); ctx.fillStyle=noNet?"#ff5a66":"#fff"; ctx.fillText(noNet?"YOK":S.ping!=null?Math.round(S.ping)+" ms":"--", W*.66+U*3.4, H*.5+U*.6);
    ctx.font=FONT(U*1.7); ctx.fillStyle="rgba(255,255,255,.75)"; ctx.fillText(S.ssid? S.ssid.slice(0,18) : "Gecikme", W*.66+U*3.4, H*.5+U*3.4);
    // alt barlar
    sportLowBar(-1, sweep!=null?sweep:sm.cpu/100, f=> f>.9?ACC:"rgba(127,212,255,.75)");
    sportLowBar( 1, sweep!=null?sweep:sm.ram/100, f=> f>.9?ACC:"rgba(127,212,255,.75)");
    ctx.textBaseline="middle"; ctx.font=FONT(U*2.6,600);
    ctx.textAlign="right"; ctx.fillStyle="#fff"; ctx.fillText("CPU "+TV(sm.cpu,v=>"%"+Math.round(v)), W*.455, H*.725);
    ctx.textAlign="left"; ctx.fillText("RAM "+TV(sm.ram,v=>"%"+Math.round(v)), W*.545, H*.725);
  }
  statusStrip(d);
  ctx.restore();
  ctx=mctx;
  // içerik katmanını ekrana bas (geçiş efektiyle)
  if(mPhase===0){ ctx.drawImage(layer,0,0,W,H); }
  else {
    const ease=t=>1-Math.pow(1-t,3);
    let sc,al,bl;
    if(mPhase<0){ const t=ease(mk); sc=1+.07*t; al=1-t; bl=t*14; }
    else { const t=ease(mk); sc=.93+.07*t; al=t; bl=(1-t)*10; }
    ctx.save(); ctx.globalAlpha=al; ctx.filter=`blur(${bl}px)`;
    ctx.translate(W/2,H/2); ctx.scale(sc,sc); ctx.translate(-W/2,-H/2); ctx.drawImage(layer,0,0,W,H); ctx.restore();

    // ortadan dışa yayılan tarama ışığı
    const e=(now-MA.start)/1000, st=clamp((e-.25)/.5);
    if(st>0&&st<1){ const x=st*W*.55, a=Math.sin(st*Math.PI);
      ctx.save(); ctx.globalCompositeOperation="lighter";
      [W/2-x,W/2+x].forEach(px=>{
        ctx.save(); ctx.translate(px,H/2); ctx.scale(U*6,H*.42);
        let g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,`rgba(255,70,90,${.45*a})`); g.addColorStop(.5,`rgba(255,40,60,${.12*a})`); g.addColorStop(1,"rgba(255,40,60,0)");
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,7); ctx.fill(); ctx.restore();
        g=ctx.createLinearGradient(0,H*.15,0,H*.85); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(.5,`rgba(255,235,240,${.8*a})`); g.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle=g; ctx.fillRect(px-1,H*.15,2,H*.7); });
      ctx.restore();
      ctx.fillStyle=`rgba(255,30,50,${.08*a})`; ctx.fillRect(0,0,W,H); }
  }
  glass(now);
  requestAnimationFrame(frame);
}

  $("pRam").textContent=TV(S.ram,v=>"%"+Math.round(v)); setBar("bRam",S.tele?S.ram:0);
  $("pDisk").textContent=TV(S.disk,v=>"%"+Math.round(v)); setBar("bDisk",S.tele?S.disk:0);
  $("pTemp").textContent=!S.tele?"--":S.temp==null?"LHM gerekli":Math.round(S.temp)+" °C";
  $("pSsid").textContent=!S.online?"Bağlı değil":S.ssid||(S.netType==="ethernet"?"Kablolu":"Bağlı");
  $("pSig").textContent=!S.online?"Boş":!S.tele?"Bağlı":S.netType==="ethernet"?"Kablolu (tam)":"%"+Math.round(S.signal);
  $("pPing").textContent=S.ping==null?"--":(S.pingSrc==="tahmini"?"~":"")+Math.round(S.ping)+" ms";
  $("pDown").textContent=mb(S.down); $("pUp").textContent=mb(S.up);
  $("mTitle").textContent=m.title||"Medya yok"; $("mArtist").textContent=m.title?(m.artist||""):"Spotify / YouTube çalınca burada görünür";
  if(m.thumb){ $("mCover").style.backgroundImage=`url(${m.thumb})`; $("mCover").textContent=""; } else { $("mCover").style.backgroundImage=""; $("mCover").textContent="♪"; }
  updateProg();
  if(S.wx){ const [ic,ds]=wInfo(S.wx.c); $("wIc").textContent=ic; $("wT").textContent=Math.round(S.wx.t)+"°"; $("wD").textContent=`${ds} · Nem %${S.wx.h}`; $("wMm").textContent=`${Math.round(S.wx.max)}° / ${Math.round(S.wx.min)}°`; $("hdrL").textContent=CFG.city.toLocaleUpperCase("tr"); }
  $("wCity").textContent="DIŞ HAVA · "+CFG.city.toLocaleUpperCase("tr");
  $("hdrR").textContent=S.tele?(S.netType==="wifi"?"Wi-Fi":S.netType==="ethernet"?"Ethernet":"Ağ"):"TELEMETRİ YOK";
  if(Date.now()-pageT>CFG.pageSeconds*1000){ let n=page+1; if(n%pages.length===2&&!m.title) n++; showPage(n); }

  const night=h>=19||h<7, engineBad=S.tele&&(S.cpu>90||(S.temp!=null&&S.temp>85));
  if(Date.now()-start<1900){ LIGHTS.forEach(l=>light(l.k,true)); return; }
  light("sigL",S.up>.15); light("sigR",S.down>.5); light("low",S.online); light("high",S.online&&night);
  light("engine",engineBad); light("temp",S.temp!=null&&S.temp>=90); light("oil",S.tele&&S.ram>=90); light("batt",S.tele&&S.disk>=90);
  light("fuel",!S.online||(S.tele&&S.signal<25),!S.online?"var(--red)":"var(--amber)"); light("warn",S.ping!=null&&S.ping>150); light("svc",!S.tele);

  let al=null;
  if(!S.online) al=["fuel","var(--red)","Yakıt bitti","İnternet bağlantısı yok"];
  else if(S.temp!=null&&S.temp>=90) al=["temp","var(--red)","Motor aşırı ısındı","CPU sıcaklığı "+Math.round(S.temp)+" °C"];
  else if(S.tele&&S.ram>=90) al=["oil","var(--red)","Yağ basıncı düşük","Bellek kullanımı %"+Math.round(S.ram)];
  else if(S.tele&&S.disk>=90) al=["batt","var(--red)","Akü zayıf","C: diski %"+Math.round(S.disk)+" dolu"];
  else if(engineBad) al=["engine","var(--amber)","Motor arıza lambası","CPU yükü %"+Math.round(S.cpu)];
  const key=al?al[2]:"";
  if(key!==lastAlert){ lastAlert=key; if(al){ $("alert").style.setProperty("--ac",al[1]); $("aIc").innerHTML=`<svg viewBox="0 0 24 24">${IC[al[0]]}</svg>`; $("aT").textContent=al[2]; $("aD").textContent=al[3]; } $("alert").classList.toggle("on",!!al); }
  else if(al) $("aD").textContent=al[3];
}
function updateProg(){ const m=S.media, pos=mediaPos();
  $("mProg").style.visibility=m.title?"visible":"hidden";
  $("mFill").style.width=(m.dur?clamp(pos/m.dur)*100:0)+"%";
  $("mPos").textContent=m.dur?fmtT(pos):"--:--"; $("mRem").textContent=m.dur?"-"+fmtT(m.dur-pos):"--:--"; $("mState").textContent=m.title?(m.playing?"▶":"❚❚"):""; }
setInterval(updateProg,100);
setInterval(ui,250); ui();
</script>
